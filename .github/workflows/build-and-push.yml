# Build and push: main → GHCR (frontend + backend) + pin digests → ArgoCD sync
name: Build and push to GHCR

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.69.3

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: build-and-push-${{ github.ref_name }}
  cancel-in-progress: true

jobs:

  # ── Test frontend ────────────────────────────────────────────────
  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high

  # ── Test backend ─────────────────────────────────────────────────
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: backend

  # ── Build & push ─────────────────────────────────────────────────
  build-and-push:
    name: Build and push
    needs: [test-frontend, test-backend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Version bump ───────────────────────────────────────────
      - name: Bump version
        id: tag
        run: |
          CONTENT=$(cat version.txt | tr -d '\r\n ')
          MAJOR=$(echo "$CONTENT" | cut -d. -f1)
          MINOR=$(echo "$CONTENT" | cut -d. -f2)
          PATCH=$(echo "$CONTENT" | cut -d. -f3)
          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]] || ! [[ "$MINOR" =~ ^[0-9]+$ ]] || ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "version.txt invalide: $CONTENT"
            exit 1
          fi
          PATCH=$(( PATCH < 9 ? PATCH + 1 : 0 ))
          [ "$PATCH" -eq 0 ] && MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW_VERSION" > version.txt
          TAG="v${NEW_VERSION}"
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Version: $CONTENT → $NEW_VERSION (tag: $TAG)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # ─────────────────── FRONTEND ────────────────────────────────
      - name: Frontend — metadata
        id: meta-front
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cuisine-front
          tags: type=raw,value=${{ steps.tag.outputs.tag }}

      - name: Frontend — build (scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: scan-cuisine-front:latest
          cache-from: type=gha,scope=front
          cache-to: type=gha,mode=max,scope=front
          pull: true

      - name: Frontend — Trivy scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.TRIVY_IMAGE }} image --exit-code 1 --severity CRITICAL,HIGH \
            --ignore-unfixed --format table scan-cuisine-front:latest

      - name: Frontend — push
        id: build-front
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta-front.outputs.tags }}
          labels: ${{ steps.meta-front.outputs.labels }}
          cache-from: type=gha,scope=front
          pull: true

      # ─────────────────── BACKEND ────────────────────────────────
      - name: Backend — metadata
        id: meta-back
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cuisine-back
          tags: type=raw,value=${{ steps.tag.outputs.tag }}

      - name: Backend — build (scan)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          push: false
          tags: scan-cuisine-back:latest
          cache-from: type=gha,scope=back
          cache-to: type=gha,mode=max,scope=back
          pull: true

      - name: Backend — Trivy scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.TRIVY_IMAGE }} image --exit-code 1 --severity CRITICAL,HIGH \
            --ignore-unfixed --format table \
            --skip-dirs "/usr/local/lib/node_modules/npm" \
            scan-cuisine-back:latest

      - name: Backend — push
        id: build-back
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-back.outputs.tags }}
          labels: ${{ steps.meta-back.outputs.labels }}
          cache-from: type=gha,scope=back
          pull: true

      # ── Pin les deux digests dans values.yaml ─────────────────────
      - name: Pin Helm values
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          OWNER="${{ github.repository_owner }}"
          REG="${{ env.REGISTRY }}"

          DIGEST_FRONT="${{ steps.build-front.outputs.digest }}"
          DIGEST_BACK="${{ steps.build-back.outputs.digest }}"

          IMAGE_FRONT="${REG}/${OWNER}/cuisine-front@${DIGEST_FRONT}"
          IMAGE_BACK="${REG}/${OWNER}/cuisine-back@${DIGEST_BACK}"

          VALUES="charts/cuisine/values.yaml"
          sed -i "s|  image: ghcr.io/.*cuisine-front.*|  image: ${IMAGE_FRONT}|" "$VALUES"
          sed -i "s|  image: ghcr.io/.*cuisine-back.*|  image: ${IMAGE_BACK}|"  "$VALUES"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt "$VALUES"

          if git diff --staged --quiet; then
            echo "Helm values déjà à jour, pas de commit"
          else
            git commit -m "chore(helm): pin images to digest $TAG [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi
