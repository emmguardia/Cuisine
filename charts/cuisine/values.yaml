# values.yaml — Club Quisine (prod)
# Les images sont mises à jour automatiquement par la CI (build-and-push.yml)

namespace: quisine

frontend:
  image: ghcr.io/emmguardia/cuisine-front@sha256:29ca65d21340b9a639d2c4a847e3236f0597b206adc80930389e3f7c5740b3e0
  imagePullPolicy: IfNotPresent
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  port: 8080
  resources:
    requests:
      cpu: "50m"
      memory: "32Mi"
    limits:
      cpu: "200m"
      memory: "64Mi"

backend:
  image: ghcr.io/emmguardia/cuisine-back@sha256:432ede6c7502d9193db0d616bd485692698c44f3bd69baff1cf87a76da8559ce
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
