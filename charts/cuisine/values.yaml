# values.yaml — Club Quisine (prod)
# Les images sont mises à jour automatiquement par la CI (build-and-push.yml)

namespace: quisine

frontend:
  image: ghcr.io/emmguardia/cuisine-front@sha256:1adfece79c028db80beef4407146d4f54e12b57457bdf8fe6d35ff562d7145e3
  imagePullPolicy: IfNotPresent
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  port: 8080
  resources:
    requests:
      cpu: "50m"
      memory: "32Mi"
    limits:
      cpu: "200m"
      memory: "64Mi"

backend:
  image: ghcr.io/emmguardia/cuisine-back@sha256:38bc9cc62df25dbb36291d3946805a8baa064a67ea4cc7e6942685776ec7a8e0
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
