# values.yaml — Club Quisine (prod)
# L'image est mise à jour automatiquement par la CI (build-and-push.yml)
# Format : ghcr.io/<owner>/cuisine-front@sha256:<digest>

namespace: quisine

frontend:
  image: ghcr.io/emmguardia/cuisine-front@sha256:9c6c6d4f1c473b2a7bdd2125c4aa6552d8982742fc1fa6a64fc8b187dd402071
  imagePullPolicy: IfNotPresent
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  port: 8080
  resources:
    requests:
      cpu: "50m"
      memory: "32Mi"
    limits:
      cpu: "200m"
      memory: "64Mi"
