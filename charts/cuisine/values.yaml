# values.yaml — Club Quisine (prod)
# L'image est mise à jour automatiquement par la CI (build-and-push.yml)
# Format : ghcr.io/<owner>/cuisine-front@sha256:<digest>

namespace: quisine

frontend:
  image: ghcr.io/emmguardia/cuisine-front@sha256:b786f7fdd2620c8d3a24de3d06f6350d9c880ef86658c78dd42c996818b4ec23
  imagePullPolicy: IfNotPresent
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  port: 8080
  resources:
    requests:
      cpu: "50m"
      memory: "32Mi"
    limits:
      cpu: "200m"
      memory: "64Mi"
