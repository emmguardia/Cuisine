apiVersion: apps/v1
kind: Deployment
metadata:
  name: cuisine-backend
  namespace: {{ include "cuisine.namespace" . }}
  labels:
    {{- include "cuisine.labels" . | nindent 4 }}
    {{- include "cuisine.backend.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "cuisine.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cuisine.backend.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: node
          image: {{ .Values.backend.image }}
          imagePullPolicy: {{ .Values.backend.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "{{ .Values.backend.port }}"
            - name: BETTER_AUTH_URL
              value: "https://quisine.zenixweb.fr"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: quisine-secrets
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: quisine-secrets
                  key: google-client-secret
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: quisine-secrets
                  key: better-auth-secret
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: quisine-secrets
                  key: db-host
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: quisine-secrets
                  key: db-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: quisine-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quisine-secrets
                  key: db-password
            # ── Cloudflare R2 (optionnel — upload photos recettes) ───────
            - name: R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: quisine-secrets
                  key: r2-account-id
                  optional: true
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: quisine-secrets
                  key: r2-access-key-id
                  optional: true
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: quisine-secrets
                  key: r2-secret-access-key
                  optional: true
            - name: R2_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: quisine-secrets
                  key: r2-bucket-name
                  optional: true
            - name: R2_PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: quisine-secrets
                  key: r2-public-url
                  optional: true
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.backend.port }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
