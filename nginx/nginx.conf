server {
    listen 8080;
    server_name quisine.zenixweb.fr;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Fichiers sensibles / scanners
    location ~* /\.env($|\.|/)  { return 404; }
    location ~* /\.git(/|$)     { return 404; }
    location ~* \.(bak|backup|sql|log|key|pem|p12|pfx|swp|save|old)$ { return 404; }
    location ~* ^/(phpinfo|wp-login|wp-admin|phpmyadmin|adminer|shell|xmlrpc)\.?(php|asp)?(/|$) { return 404; }
    location ~* ^/(docker-compose\.yml|Dockerfile|package\.json|\.htaccess|web\.config)$ { return 404; }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Proxy vers le backend — toutes méthodes autorisées
    location /api/ {
        proxy_pass         http://cuisine-backend-service.quisine.svc.cluster.local:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        limit_except GET HEAD OPTIONS {
            return 405;
        }
        if ($request_uri ~ ^(.+)/$) {
            return 301 $1;
        }
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        limit_except GET HEAD OPTIONS { return 405; }
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        limit_except GET HEAD OPTIONS { return 405; }
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable" always;
        try_files $uri =404;
    }

    location /images/ {
        limit_except GET HEAD OPTIONS { return 405; }
        expires 1y;
        add_header Cache-Control "public, no-transform" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;
    gzip_comp_level 6;
    gzip_disable "msie6";
}
