# map est dans le contexte http (les fichiers conf.d sont inclus dans http {})
map $request_method $is_unsafe_method {
    default 0;
    POST    1;
    PUT     1;
    DELETE  1;
    PATCH   1;
}

server {
    listen 8080;
    server_name quisine.zenixweb.fr;

    root /usr/share/nginx/html;
    index index.html;

    # K3s CoreDNS — résolution lazy (à la requête, pas au démarrage)
    resolver 10.43.0.10 valid=30s ipv6=off;

    # Fichiers sensibles / scanners
    location ~* /\.env($|\.|/)  { return 404; }
    location ~* /\.git(/|$)     { return 404; }
    location ~* \.(bak|backup|sql|log|key|pem|p12|pfx|swp|save|old)$ { return 404; }
    location ~* ^/(phpinfo|wp-login|wp-admin|phpmyadmin|adminer|shell|xmlrpc)\.?(php|asp)?(/|$) { return 404; }
    location ~* ^/(docker-compose\.yml|Dockerfile|package\.json|\.htaccess|web\.config)$ { return 404; }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Proxy vers le backend — variable pour résolution DNS lazy
    location /api/ {
        set $backend "http://cuisine-backend-service.quisine.svc.cluster.local:3000";
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        # Content-Security-Policy sur le document HTML du SPA.
        # script-src 'self' : Vite ne génère aucun script inline (bundle externe only).
        # style-src unsafe-inline : styles inline React (style={{}}) + Google Fonts CSS.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # Méthodes d'écriture bloquées sur les fichiers statiques
        if ($is_unsafe_method) {
            return 405;
        }
        # Suppression du slash final
        if ($uri ~ ^(.+)/$) {
            return 301 $1;
        }
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable" always;
        try_files $uri =404;
    }

    location /images/ {
        expires 1y;
        add_header Cache-Control "public, no-transform" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;
    gzip_comp_level 6;
    gzip_disable "msie6";
}
